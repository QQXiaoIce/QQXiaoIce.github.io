<script>
/**
 * 🛠️ 懒人维护区：只需修改这个 navData 数组即可
 * 每一个 {} 代表一个卡片，每一个 category 代表一个分类
 */
const navData = [
  {
    category: "🚀 AI 工具",
    items: [
      { name: "DeepSeek", link: "https://www.deepseek.com/", desc: "强大的国产大模型，响应极快" },
      { name: "Gemini", link: "https://gemini.google.com/", desc: "Google 的多模态 AI，集成 Google 生态" },
      { name: "ChatGPT", link: "https://chatgpt.com/", desc: "OpenAI 旗下的行业标杆" }
    ]
  },
  {
    category: "📦 常用工具 & 存储",
    items: [
      { name: "百度网盘", link: "https://pan.baidu.com/", desc: "国内常用的资源存储地" },
      { name: "坚果云", link: "https://www.jianguoyun.com/", desc: "同步办公首选，专业稳定" },
      { name: "GitHub", link: "https://github.com/", desc: "全球最大的开源代码托管平台" }
    ]
  },
  {
    category: "🎨 资源站",
    items: [
      { name: "Unsplash", link: "https://unsplash.com/", desc: "高品质免费无版权图片库" },
      { name: "Iconfont", link: "https://www.iconfont.cn/", desc: "阿里巴巴矢量图标库" }
    ]
  }
];

// -------------------------------------------------------------
// ⚙️ 自动化渲染引擎（写一次，终身免维护）
// -------------------------------------------------------------
function renderNav(data) {
  const container = document.getElementById('nav-app');
  if (!container) return;

  const html = data.map(group => `
    <div class="nav-section">
      <h2 class="nav-title">${group.category}</h2>
      <div class="nav-grid">
        ${group.items.map(item => `
          <a href="${item.link}" target="_blank" class="nav-card-wrapper">
            <div class="nav-card">
              <div class="nav-name">${item.name}</div>
              <div class="nav-desc">${item.desc}</div>
            </div>
          </a>
        `).join('')}
      </div>
    </div>
  `).join('');

  container.innerHTML = html;
}

// 确保在页面加载后执行
document.addEventListener('DOMContentLoaded', () => renderNav(navData));
// 针对部分 Hexo 主题切换页面不刷新的情况，立即执行一次
renderNav(navData);
</script>
